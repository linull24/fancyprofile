name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The generated SVGs are committed because the README references them, so
      # they must still match the source. This compares markup and decoded
      # displacement-map pixels rather than file bytes: zlib's deflate output is
      # not stable across zlib versions, so the base64 payload legitimately
      # differs between this runner and a laptop.
      - name: Rebuild and check assets are in sync
        run: npm run verify

      - uses: actions/upload-artifact@v4
        with:
          name: experiments
          path: experiments/*.svg
          if-no-files-found: error
